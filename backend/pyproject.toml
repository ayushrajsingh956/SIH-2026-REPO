[project]
name = "legalmetro-shield-backend"
version = "0.1.0"
description = "FastAPI backend for LegalMetro Shield packaged commodities compliance system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "celery>=5.4.0",
    "redis>=5.0.8",
    "minio>=7.2.8",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.9",
    "email-validator>=2.2.0",
    "python-magic>=0.4.27",
    "opencv-python-headless>=4.10.0",
    "google-genai>=0.1.1",
    "pytesseract>=0.3.10",
    "pillow>=10.4.0",
    "beautifulsoup4>=4.12.3",
    "numpy>=1.26.0",
    "jinja2>=3.1.4",
    "weasyprint>=62.0",
    "python-docx>=1.1.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "respx>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[dependency-groups]
dev = [
    "locust>=2.31.0",
    "pypdf>=4.3.0",
]
